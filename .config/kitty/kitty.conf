# Theme
include colors.conf

# Fonts
font_family      JetBrainsMono NF
bold_font        JetBrainsMono NF Bold
italic_font      JetBrainsMono NF Italic
bold_italic_font JetBrainsMono NF Bold Italic
font_size        13.0

# Cusor
# block / beam / underline
cursor_shape               block
cursor_blink_interval      0
cursor_stop_blinking_after 0
shell_integration          no-cursor

# Scrollback
scrollback_lines 5000
wheel_scroll_multiplier 3.0

# Mouse
mouse_hide_wait -1

#Tab
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     angled
tab_bar_align           left
tab_bar_background      none
active_tab_font_style   normal
inactive_tab_font_style italic

# Window
#window_decorations      full
remember_window_size    no
initial_window_width    800
initial_window_height   600
window_border_width     1.5pt
enabled_layouts         tall
window_padding_width    0
#window_margin_width     2
hide_window_decorations no
confirm_os_window_close 0

# Others
term xterm-256color
# linux_display_server x11

# Keyboard
map ctrl+l clear_terminal to_cursor_scroll active

#map ctrl+h    neighboring_window left
#map ctrl+l    neighboring_window right
#map ctrl+j    neighboring_window bottom
#map ctrl+k    neighboring_window top

map ctrl+shift+h  move_window left
map ctrl+shift+l  move_window right
map ctrl+shift+j  move_window down
map ctrl+shift+k  move_window up

map ctrl+t          new_tab
# map ctrl+shift+t    new_tab_with_cwd
map ctrl+tab        next_tab
map ctrl+shift+tab  previous_tab
map ctrl+w          close_tab
# map f2              set_tab_title
# map ctrl+f2         set_tab_title ""

map ctrl+plus    increase_font_size
map ctrl+minus   decrease_font_size
map ctrl+0       reset_font_size

map ctrl+shift+c   copy_to_clipboard
map ctrl+shift+v   paste_from_clipboard
map ctrl+shift+f show_scrollback
