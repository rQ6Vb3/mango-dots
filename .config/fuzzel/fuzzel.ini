include=~/.config/fuzzel/colors

[main]
font=JetBrainsMono NFP:style:Medium:size=12
prompt="❯ "
terminal=kitty -e

width=100
lines=10
minimal-lines=true
tabs=4

y-margin=10

horizontal-pad=16
vertical-pad=8
inner-pad=10

anchor=top
layer=overlay
match-mode=fuzzy


[border]
width=2
radius=0
selection-radius=0


[key-bindings]
execute=Return KP_Enter
cancel=Escape Control+g

next=none
prev=none
next-with-wrap=Down
prev-with-wrap=Up

cursor-home=Control+a
cursor-end=Control+e
first=Home
last=End

execute-input=none
expunge=none
custom-1=Shift+Return
custom-2=Control+c
custom-3=Shift+Delete
custom-4=Mod1+Left
